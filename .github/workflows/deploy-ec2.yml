name: Deploy EC2 Auto Scaling Group

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  deploy-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Package application
        shell: bash
        run: |
          set -eu
          git archive --format=zip --output=deployment.zip HEAD

          if unzip -Z1 deployment.zip | grep -Eq '(^|/)\.env$'; then
            echo "ERROR: .env file must not be deployed."
            exit 1
          fi

          test -s deployment.zip
          echo "Deployment package created."

      - name: Upload package to S3
        shell: bash
        run: |
          set -eu
          aws s3 cp deployment.zip \
            s3://secure-3-tier-deploy-244546636157-us-east-1/deployments/latest.zip \
            --region us-east-1 \
            --sse AES256

      - name: Create temporary S3 download URL
        id: presign
        shell: bash
        run: |
          set -eu
          URL=$(aws s3 presign \
            s3://secure-3-tier-deploy-244546636157-us-east-1/deployments/latest.zip \
            --expires-in 900 \
            --region us-east-1)

          test -n "$URL"
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Prepare SSM deployment command
        shell: bash
        env:
          PRESIGNED_URL: ${{ steps.presign.outputs.url }}
        run: |
          set -eu

          python - <<'PY_SETUP'
          import json
          import os
          import shlex

          command = r'''
          set -eu

          APP_DIR="/home/ubuntu/secure-3-tier-web-application"
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          test -d "$APP_DIR"
          test -x "$APP_DIR/venv/bin/python"
          command -v curl

          curl --fail --silent --show-error --location \
            __PRESIGNED_URL__ \
            --output "$WORK_DIR/deployment.zip"

          test -s "$WORK_DIR/deployment.zip"

          "$APP_DIR/venv/bin/python" - "$WORK_DIR/deployment.zip" "$APP_DIR" <<'PY_EXTRACT'
          import pathlib
          import shutil
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          root = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  rel = PurePosixPath(item.filename)

                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit("Unsafe ZIP path: " + item.filename)

                  if not rel.parts:
                      continue

                  if rel.as_posix() == "config/settings.py" or rel.name == ".env":
                      continue

                  target = root.joinpath(*rel.parts).resolve()

                  if root != target and root not in target.parents:
                      raise SystemExit("Unsafe destination: " + item.filename)

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(item) as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)

          print("ZIP extracted successfully.")
          PY_EXTRACT

          test -f "$APP_DIR/requirements.txt"

          "$APP_DIR/venv/bin/pip" install \
            -r "$APP_DIR/requirements.txt"

          "$APP_DIR/venv/bin/python" "$APP_DIR/manage.py" check

          systemctl restart gunicorn
          systemctl reload nginx

          HEALTHY=0

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 \
                http://127.0.0.1/ -o /dev/null; then
              HEALTHY=1
              break
            fi

            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: Application did not become healthy within 60 seconds."
            systemctl status gunicorn --no-pager || true
            tail -n 60 /var/log/nginx/error.log || true
            exit 1
          fi

          echo "EC2 deployment and local HTTP check succeeded."
          '''

          command = command.replace(
              "__PRESIGNED_URL__",
              shlex.quote(os.environ["PRESIGNED_URL"])
          )

          with open("ssm-parameters.json", "w") as f:
              json.dump({"commands": [command]}, f)
          PY_SETUP

      - name: Run deployment through SSM
        shell: bash
        run: |
          set -eu

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=secure-3-tier-asg-instance" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --max-errors "0" \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            RESULT=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --region us-east-1 \
              --output json)

            TOTAL=$(echo "$RESULT" | jq '.CommandInvocations | length')
            SUCCESS=$(echo "$RESULT" | jq \
              '[.CommandInvocations[] | select(.Status == "Success")] | length')
            FAILED=$(echo "$RESULT" | jq \
              '[.CommandInvocations[] | select(.Status | test("Failed|TimedOut|Cancelled|Cancelling"))] | length')

            if [ "$FAILED" -gt 0 ]; then
              echo "$RESULT" | jq '.CommandInvocations[] |
                {InstanceId, Status, StatusDetails, Output: .CommandPlugins[0].Output}'
              exit 1
            fi

            if [ "$TOTAL" -gt 0 ] && [ "$SUCCESS" -eq "$TOTAL" ]; then
              echo "$RESULT" | jq '.CommandInvocations[] |
                {InstanceId, Status, Output: .CommandPlugins[0].Output}'
              exit 0
            fi

            sleep 10
          done

          echo "Deployment timed out. Check SSM Run Command in AWS Console."
          exit 1